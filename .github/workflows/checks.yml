name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - name: Parse mobile JSX
        run: |
          npm install --prefix /tmp/jsx-check @babel/parser@7
          NODE_PATH=/tmp/jsx-check/node_modules node -e "require('@babel/parser').parse(require('fs').readFileSync('app/App.js','utf8'), {sourceType:'module',plugins:['jsx']})"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nutriai:test .
      - name: Verify container startup
        run: |
          docker run -d --name nutriai -p 8000:8000 nutriai:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs nutriai
          exit 1

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  mobile-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npx expo export --platform web --output-dir ../work/mobile-web
        working-directory: app
        env:
          CI: '1'
