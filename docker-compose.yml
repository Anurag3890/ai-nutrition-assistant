services:
  ai-nutrition-assistant:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - nutrition-data:/app/data/storage
    environment:
      NUTRIAI_CORS_ORIGINS: ${NUTRIAI_CORS_ORIGINS:-http://localhost:8000}
      NUTRIAI_SECURE_COOKIE: ${NUTRIAI_SECURE_COOKIE:-false}
    restart: unless-stopped
volumes:
  nutrition-data:
